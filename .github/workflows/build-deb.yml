name: Build Debian package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            git build-essential debhelper dh-python \
            pybuild-plugin-pyproject python3-all python3-setuptools \
            python3-wheel

      - name: Build package as a normal user
        run: |
          test "$(python3 setup.py --version)" = "$(dpkg-parsechangelog --show-field Version)"
          dpkg-buildpackage -us -uc -b

      - name: Verify and collect package
        shell: bash
        run: |
          set -euo pipefail
          version="$(dpkg-parsechangelog --show-field Version)"
          package="../odroid-homecloud-display_${version}_all.deb"
          test "$(dpkg-deb --field "$package" Package)" = odroid-homecloud-display
          test "$(dpkg-deb --field "$package" Version)" = "$version"
          test "$(dpkg-deb --field "$package" Architecture)" = all
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          mkdir artifacts
          cp "$package" artifacts/
          cd artifacts
          sha256sum ./*.deb > SHA256SUMS

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: odroid-homecloud-display-deb
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
